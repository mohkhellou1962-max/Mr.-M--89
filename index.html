<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Identity Card - Khellou Mourad</title>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Livvic:ital,wght@0,400;0,600;0,700;0,900;1,400;1,700&display=swap');

    :root {
      /* Card dimensions (Standard ISO/IEC 7810 ID-1 standard) */
      --card-width: 85.6mm;
      --card-height: 54mm;
      --card-radius: 3.18mm;

      /* Main Color Palette: Metallic Blue, Beige, Gold */
      --color-metallic-dark: #0a1726;
      --color-metallic-mid: #162c46;
      --color-metallic-light: #25466c;
      --color-gold: #d4af37;
      --color-gold-light: #f3e5ab;
      --color-beige: #f5f0e6;
      --color-beige-dark: #e6ddce;
      --color-text-primary: #ffffff;
      --color-text-secondary: #d1dbe5;
      
      /* Accent Color: Light Green */
      --color-accent-green: #2ecc71;
      --color-accent-green-hover: #27ae60;

      /* Social Disabled / Greyed out state */
      --color-disabled: rgba(255, 255, 255, 0.3);

      /* Typography & Spacing */
      --font-family: 'Livvic', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      --shadow-card: 0 20px 40px rgba(0, 0, 0, 0.4), 0 5px 15px rgba(0, 0, 0, 0.2);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: var(--font-family);
      background: radial-gradient(circle at center, #1b2838 0%, #0d131a 100%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      color: var(--color-text-primary);
      overflow-x: hidden;
    }

    .viewport-wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 100%;
      max-width: 600px;
    }

    .card-perspective-container {
      perspective: 1000px;
      margin-bottom: 28px;
      display: flex;
      justify-content: center;
      align-items: center;
      width: 100%;
    }

    .id-card {
      width: var(--card-width);
      height: var(--card-height);
      border-radius: var(--card-radius);
      background: linear-gradient(135deg, var(--color-metallic-dark) 0%, var(--color-metallic-mid) 50%, var(--color-metallic-light) 100%);
      box-shadow: var(--shadow-card);
      position: relative;
      overflow: hidden;
      display: grid;
      grid-template-columns: 32mm 1fr;
      padding: 3.5mm;
      gap: 3mm;
      user-select: none;
      transform-style: preserve-3d;
      transition: transform 0.15s ease-out, box-shadow 0.15s ease-out;
      /* Subtle light edge catching highlights */
      border: 0.5px solid rgba(255, 255, 255, 0.25);
      box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.4), inset 0 -1px 1px rgba(0, 0, 0, 0.5), var(--shadow-card);
    }

    /* Light sheen effect overlay */
    .id-card::before {
      content: '';
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: linear-gradient(
        45deg,
        transparent 42%,
        rgba(255, 255, 255, 0.08) 48%,
        rgba(255, 255, 255, 0.18) 50%,
        rgba(255, 255, 255, 0.08) 52%,
        transparent 58%
      );
      pointer-events: none;
      z-index: 10;
      transform: translateY(var(--sheen-y, 0px)) translateX(var(--sheen-x, 0px));
      transition: transform 0.1s ease-out;
    }

    /* Decorative Gold Accent Bar */
    .card-accent-bar {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 1.2mm;
      background: linear-gradient(90deg, var(--color-gold) 0%, var(--color-gold-light) 50%, var(--color-gold) 100%);
      z-index: 2;
    }

    .card-left-col {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      z-index: 3;
      padding-top: 1.5mm;
    }

    .photo-wrapper {
      width: 21mm;
      height: 21mm;
      border-radius: 2mm;
      overflow: hidden;
      position: relative;
      border: 0.4mm solid var(--color-gold);
      background-color: var(--color-metallic-dark);
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.3);
      flex-shrink: 0;
    }

    .photo-wrapper img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    /* Fallback Initials Avatar Circle */
    .avatar-fallback {
      display: none;
      width: 100%;
      height: 100%;
      background: linear-gradient(135deg, var(--color-gold) 0%, var(--color-metallic-dark) 100%);
      color: var(--color-beige);
      font-weight: bold;
      font-size: 7pt;
      align-items: center;
      justify-content: center;
      letter-spacing: 0.5px;
    }

    .person-name {
      font-size: 8.5pt;
      font-weight: 900;
      color: var(--color-beige);
      margin-top: 1.5mm;
      line-height: 1.15;
      text-transform: uppercase;
      letter-spacing: 0.3px;
    }

    .person-title {
      font-size: 5.8pt;
      font-weight: 700;
      color: var(--color-gold-light);
      margin-top: 0.8mm;
      line-height: 1.15;
    }

    .person-org {
      font-size: 4.8pt;
      font-weight: 600;
      color: var(--color-text-secondary);
      margin-top: 0.5mm;
      line-height: 1.15;
    }

    .card-right-col {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding-top: 1mm;
      padding-bottom: 0.5mm;
      z-index: 3;
    }

    .org-badge-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 0.2mm solid rgba(212, 175, 55, 0.35);
      padding-bottom: 0.8mm;
    }

    .org-badge-text {
      font-size: 5.2pt;
      font-weight: 900;
      letter-spacing: 0.8px;
      color: var(--color-gold);
      text-transform: uppercase;
    }

    .contact-details {
      display: flex;
      flex-direction: column;
      gap: 2.2mm;
      margin-top: 1.2mm;
    }

    .contact-item {
      display: flex;
      flex-direction: column;
      text-decoration: none;
      color: inherit;
      position: relative;
      border-radius: 2px;
    }

    .contact-label {
      font-size: 4.2pt;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--color-gold-light);
      opacity: 0.95;
      font-weight: 700;
    }

    .contact-value {
      font-size: 6.2pt;
      font-weight: 700;
      color: var(--color-text-primary);
      line-height: 1.15;
      transition: color 0.15s ease;
    }

    a.contact-item:hover .contact-value,
    a.contact-item:focus-visible .contact-value {
      color: var(--color-accent-green);
    }

    /* Social accounts row */
    .social-row {
      display: flex;
      align-items: center;
      gap: 2.5mm;
      margin-top: auto;
      padding-top: 1mm;
    }

    .social-link {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 5.5mm;
      height: 5.5mm;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.08);
      color: var(--color-beige);
      text-decoration: none;
      transition: background 0.2s ease, color 0.2s ease, transform 0.15s ease;
      position: relative;
    }

    .social-link svg {
      width: 3.2mm;
      height: 3.2mm;
      fill: currentColor;
    }

    .social-link:not(.disabled):hover,
    .social-link:not(.disabled):focus-visible {
      background: var(--color-accent-green);
      color: #0d131a;
      transform: translateY(-1px);
    }

    .social-link.disabled {
      color: var(--color-disabled);
      cursor: not-allowed;
      background: rgba(255, 255, 255, 0.03);
    }

    /* Ensure minimum 44px tap targets for mobile accessibility */
    .touch-target {
      position: relative;
    }

    @media (pointer: coarse) {
      .touch-target::after {
        content: '';
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        min-width: 44px;
        min-height: 44px;
      }
    }

    .controls-container {
      margin-top: 10px;
      display: flex;
      justify-content: center;
    }

    .btn-print {
      background: linear-gradient(135deg, var(--color-accent-green) 0%, var(--color-accent-green-hover) 100%);
      color: #0a1726;
      font-family: inherit;
      font-size: 14px;
      font-weight: 700;
      padding: 12px 28px;
      border: none;
      border-radius: 24px;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(46, 204, 113, 0.3);
      display: inline-flex;
      align-items: center;
      gap: 8px;
      transition: transform 0.15s ease, box-shadow 0.15s ease, background 0.15s ease;
      min-height: 44px;
      min-width: 44px;
    }

    .btn-print:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 16px rgba(46, 204, 113, 0.4);
    }

    .btn-print:active {
      transform: translateY(0);
    }

    .btn-print svg {
      width: 18px;
      height: 18px;
      fill: currentColor;
    }

    /* Visible accessibility focus indicators */
    a:focus-visible,
    button:focus-visible {
      outline: 2px solid var(--color-accent-green);
      outline-offset: 2px;
    }

    /* Mobile Scaling for Screen Preview */
    @media (max-width: 420px) {
      .viewport-wrapper {
        transform: scale(0.95);
      }
    }

    @media print {
      @page {
        size: 85.6mm 54mm;
        margin: 0;
      }

      body {
        background: none !important;
        padding: 0 !important;
        margin: 0 !important;
        display: block !important;
      }

      .controls-container {
        display: none !important;
      }

      .viewport-wrapper, .card-perspective-container {
        perspective: none !important;
        margin: 0 !important;
        padding: 0 !important;
        width: 85.6mm !important;
        height: 54mm !important;
      }

      .id-card {
        box-shadow: none !important;
        transform: none !important;
        border: none !important;
        width: 85.6mm !important;
        height: 54mm !important;
        page-break-inside: avoid;
        -webkit-print-color-adjust: exact;
        print-color-adjust: exact;
      }

      .id-card::before {
        display: none !important;
      }
    }
  </style>

  <script>
    (function() {
      const card = document.getElementById('id-card');
      const container = document.getElementById('perspective-container');
      
      // Check for reduced motion preference
      const prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)');

      function handleMouseMove(e) {
        if (prefersReducedMotion.matches) return;

        const rect = container.getBoundingClientRect();
        const cardX = e.clientX - rect.left;
        const cardY = e.clientY - rect.top;

        const centerX = rect.width / 2;
        const centerY = rect.height / 2;

        // Calculate rotation angles (max ~8 degrees tilt)
        const rotateX = ((cardY - centerY) / centerY) * -8;
        const rotateY = ((cardX - centerX) / centerX) * 8;

        // Calculate sheen offset movement
        const sheenX = ((cardX - centerX) / centerX) * 40;
        const sheenY = ((cardY - centerY) / centerY) * 40;

        card.style.transform = `rotateX(${rotateX}deg) rotateY(${rotateY}deg)`;
        card.style.setProperty('--sheen-x', `${sheenX}px`);
        card.style.setProperty('--sheen-y', `${sheenY}px`);
      }

      function handleMouseLeave() {
        if (prefersReducedMotion.matches) return;

        // Reset to original position gently
        card.style.transform = 'rotateX(0deg) rotateY(0deg)';
        card.style.setProperty('--sheen-x', '0px');
        card.style.setProperty('--sheen-y', '0px');
      }

      // Attach interactive listeners
      container.addEventListener('mousemove', handleMouseMove);
      container.addEventListener('mouseleave', handleMouseLeave);
    })();
  </script>
